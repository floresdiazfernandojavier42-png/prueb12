<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 1;
            min-height: 99vh;
            place-items: center;
            font-family: Arial, sans-serif;
        }

        table {
            width: 80%;
            max-width: 900px;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            overflow: hidden;
        }

        td {
            padding: 30px 25px;
            border: 3px solid #fff;
            text-align: center;
            background: linear-gradient(135deg, rgba(123, 47, 247, 0.75), rgba(255, 106, 136, 0.8));
        }

        h1 {
            margin: 0;
            color: #ffffff;
            font-size: clamp(1.5rem, 3vw, 3rem);
            line-height: 1.3;
            letter-spacing: 1px;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.35);
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>
                <h1>hola soy fernando javier </h1>
                <h1>holamundo</h1>
            </td>
        </tr>
    </table>
</body>
</html>
